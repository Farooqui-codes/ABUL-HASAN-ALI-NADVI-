<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="hallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B4A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D6A84F"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#hallGrad)"/>
  
  <!-- Chandelier / Fanoos hanging from top -->
  <line x1="250" y1="0" x2="250" y2="45" stroke="#D6A84F" stroke-width="2"/>
  <path d="M 230 45 L 270 45 L 260 75 L 240 75 Z" fill="url(#goldArch)"/>
  <circle cx="250" cy="80" r="4" fill="#FEF08A"/>

  <!-- Islamic Prayer Arches (Mihrab perspective) -->
  <path d="M 100 350 L 100 180 C 100 100, 200 60, 250 30 C 300 60, 400 100, 400 180 L 400 350 Z" 
        fill="rgba(255,255,255,0.06)" stroke="url(#goldArch)" stroke-width="3"/>
  <path d="M 140 350 L 140 200 C 140 135, 210 100, 250 80 C 290 100, 360 135, 360 200 L 360 350 Z" 
        fill="rgba(255,255,255,0.09)" stroke="url(#goldArch)" stroke-width="2"/>
  <path d="M 180 350 L 180 220 C 180 170, 225 140, 250 120 C 275 140, 320 170, 320 220 L 320 350 Z" 
        fill="rgba(255,255,255,0.12)" stroke="url(#goldArch)" stroke-width="2"/>

  <!-- Carpet with Saf / Prayer Rows -->
  <polygon points="50,350 450,350 380,270 120,270" fill="#991B1B"/>
  <polygon points="120,270 380,270 340,240 160,240" fill="#B91C1C"/>
  <line x1="90" y1="310" x2="410" y2="310" stroke="#FDE047" stroke-width="3" stroke-dasharray="12,8"/>
  <line x1="140" y1="255" x2="360" y2="255" stroke="#FDE047" stroke-width="2.5" stroke-dasharray="10,6"/>

  <text x="250" y="170" font-family="'Noto Naskh Arabic', serif" font-size="22" font-weight="700" fill="#FDE047" text-anchor="middle">
    حَيَّ عَلَى الصَّلَاةِ
  </text>
  <text x="250" y="200" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">
    Campus Musalla &amp; Spiritual Centre
  </text>
</svg>

