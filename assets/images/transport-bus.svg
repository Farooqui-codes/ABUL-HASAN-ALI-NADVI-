<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="transBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#transBg)"/>
  
  <!-- Road -->
  <rect x="0" y="270" width="500" height="80" fill="#334155"/>
  <line x1="0" y1="310" x2="500" y2="310" stroke="#FDE047" stroke-width="4" stroke-dasharray="25,20"/>

  <!-- Bus Body -->
  <rect x="60" y="110" width="380" height="150" rx="18" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
  <!-- Front Hood slope -->
  <path d="M 400 160 L 440 180 L 440 260 L 400 260 Z" fill="#F59E0B"/>
  
  <!-- Windshield and Windows -->
  <rect x="80" y="130" width="55" height="45" rx="5" fill="#38BDF8"/>
  <rect x="145" y="130" width="55" height="45" rx="5" fill="#38BDF8"/>
  <rect x="210" y="130" width="55" height="45" rx="5" fill="#38BDF8"/>
  <rect x="275" y="130" width="55" height="45" rx="5" fill="#38BDF8"/>
  <rect x="340" y="130" width="60" height="45" rx="5" fill="#38BDF8"/>
  <path d="M 405 135 L 435 175 L 405 175 Z" fill="#38BDF8"/>

  <!-- School Bus Name Side Banner -->
  <rect x="80" y="195" width="310" height="35" rx="4" fill="#142B4A"/>
  <text x="235" y="212" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FDE047" text-anchor="middle">
    SYED ABUL HASAN ALI NADWI
  </text>
  <text x="235" y="225" font-family="'Noto Naskh Arabic', serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    اسکول بس ٹرانسپورٹ سروس
  </text>

  <!-- Wheels -->
  <!-- Left Wheel -->
  <circle cx="140" cy="270" r="34" fill="#1E293B"/>
  <circle cx="140" cy="270" r="18" fill="#94A3B8"/>
  <circle cx="140" cy="270" r="6" fill="#FDE047"/>
  <!-- Right Wheel -->
  <circle cx="360" cy="270" r="34" fill="#1E293B"/>
  <circle cx="360" cy="270" r="18" fill="#94A3B8"/>
  <circle cx="360" cy="270" r="6" fill="#FDE047"/>

  <!-- Headlight & Tail lights -->
  <rect x="435" y="220" width="6" height="16" rx="3" fill="#FEF08A"/>
  <rect x="58" y="220" width="5" height="16" rx="2" fill="#EF4444"/>
</svg>

