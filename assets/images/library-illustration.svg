<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#libBg)"/>
  
  <!-- Bookshelf Background -->
  <rect x="40" y="40" width="420" height="230" rx="8" fill="#78350F" stroke="#451A03" stroke-width="4"/>
  <!-- Shelves -->
  <line x1="40" y1="110" x2="460" y2="110" stroke="#451A03" stroke-width="6"/>
  <line x1="40" y1="180" x2="460" y2="180" stroke="#451A03" stroke-width="6"/>
  <line x1="40" y1="250" x2="460" y2="250" stroke="#451A03" stroke-width="6"/>

  <!-- Row 1 Books (Tafseer, Hadith, Arabic) -->
  <rect x="60" y="55" width="22" height="55" fill="#15803D" rx="2"/>
  <rect x="85" y="50" width="26" height="60" fill="#1E3A8A" rx="2"/>
  <rect x="114" y="60" width="20" height="50" fill="#D97706" rx="2"/>
  <rect x="137" y="52" width="28" height="58" fill="#B91C1C" rx="2"/>
  <rect x="168" y="58" width="18" height="52" fill="#4338CA" rx="2"/>
  <rect x="190" y="50" width="26" height="60" fill="#047857" rx="2"/>

  <!-- Row 2 Books (Science, Math, History) -->
  <rect x="60" y="125" width="24" height="55" fill="#2563EB" rx="2"/>
  <rect x="87" y="120" width="20" height="60" fill="#D6A84F" rx="2"/>
  <rect x="110" y="130" width="28" height="50" fill="#0284C7" rx="2"/>
  <rect x="141" y="122" width="22" height="58" fill="#7C3AED" rx="2"/>
  <rect x="166" y="128" width="26" height="52" fill="#059669" rx="2"/>

  <!-- Row 3 Books -->
  <rect x="60" y="195" width="30" height="55" fill="#B45309" rx="2"/>
  <rect x="93" y="190" width="24" height="60" fill="#1E293B" rx="2"/>
  <rect x="120" y="200" width="22" height="50" fill="#2563EB" rx="2"/>

  <!-- Study Table with Lamp & Quran Stand -->
  <rect x="220" y="210" width="240" height="110" rx="6" fill="#92400E"/>
  <rect x="235" y="320" width="20" height="25" fill="#78350F"/>
  <rect x="425" y="320" width="20" height="25" fill="#78350F"/>

  <!-- Lamp -->
  <path d="M 250 210 L 250 160 L 280 160" stroke="#CBD5E1" stroke-width="4" fill="none"/>
  <path d="M 270 160 L 295 175 L 265 175 Z" fill="#D6A84F"/>

  <!-- Holy Book on Table -->
  <path d="M 330 195 L 355 175 L 380 195 L 365 200 L 355 188 L 345 200 Z" fill="#B45309"/>
  <path d="M 320 180 C 335 170, 350 172, 355 177 C 360 172, 375 170, 390 180 L 390 190 C 375 180, 360 182, 355 187 C 350 182, 335 180, 320 190 Z" fill="#FFFBEB" stroke="#D6A84F" stroke-width="1.5"/>

  <text x="355" y="260" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Central Research Library
  </text>
  <text x="355" y="280" font-family="'Noto Naskh Arabic', serif" font-size="13" fill="#FEF08A" text-anchor="middle">
    مکتبہ سید ابوالحسن علی ندوی
  </text>
</svg>

