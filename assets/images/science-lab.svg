<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#labBg)"/>
  
  <!-- Modern Lab Workstation Bench -->
  <rect x="50" y="220" width="400" height="90" rx="4" fill="#0F172A"/>
  <rect x="40" y="210" width="420" height="15" rx="3" fill="#334155"/>

  <!-- Microscope -->
  <g transform="translate(100, 100)">
    <path d="M 50 110 L 10 110 L 10 100 L 50 100 Z" fill="#475569"/>
    <rect x="25" y="70" width="10" height="30" fill="#64748B"/>
    <path d="M 25 70 C 25 40, 55 40, 55 70" stroke="#0284C7" stroke-width="8" fill="none"/>
    <rect x="48" y="45" width="28" height="40" rx="4" transform="rotate(-30, 48, 45)" fill="#0F766E"/>
    <circle cx="68" cy="40" r="7" fill="#38BDF8"/>
  </g>

  <!-- Chemical Flasks with colorful liquids -->
  <!-- Conical Flask with Blue Solution -->
  <path d="M 235 155 L 245 155 L 245 175 L 265 210 L 215 210 L 235 175 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <path d="M 223 195 L 257 195 L 265 210 L 215 210 Z" fill="#0284C7" opacity="0.8"/>
  <!-- Bubbles -->
  <circle cx="235" cy="190" r="3" fill="#38BDF8"/>
  <circle cx="245" cy="180" r="2" fill="#38BDF8"/>

  <!-- Round Flask with Amber Solution -->
  <circle cx="310" cy="185" r="25" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <rect x="306" y="145" width="8" height="20" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <path d="M 288 195 A 25 25 0 0 0 332 195 Z" fill="#F59E0B" opacity="0.85"/>

  <!-- Test tube rack -->
  <rect x="360" y="165" width="70" height="45" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="370" y="140" width="8" height="35" rx="4" fill="#10B981"/>
  <rect x="385" y="140" width="8" height="35" rx="4" fill="#6366F1"/>
  <rect x="400" y="140" width="8" height="35" rx="4" fill="#EC4899"/>
  <rect x="415" y="140" width="8" height="35" rx="4" fill="#EAB308"/>

  <text x="250" y="270" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    STEM &amp; Computer Science Laboratories
  </text>
  <text x="250" y="292" font-family="'Noto Naskh Arabic', serif" font-size="12" fill="#38BDF8" text-anchor="middle">
    جدید سائنسی و کمپیوٹر لیب
  </text>
</svg>

