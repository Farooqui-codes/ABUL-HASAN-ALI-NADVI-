<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D6A84F"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="blueGradMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#142B4A"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield / Islamic Arch Background -->
  <path d="M 50 3 C 78 3, 97 22, 97 50 C 97 78, 65 95, 50 97 C 35 95, 3 78, 3 50 C 3 22, 22 3, 50 3 Z" 
        fill="url(#blueGradMark)" stroke="url(#goldGradMark)" stroke-width="3"/>

  <!-- Inner star lattice -->
  <path d="M 50 14 L 58 26 L 72 22 L 68 36 L 80 44 L 68 52 L 72 66 L 58 62 L 50 74 L 42 62 L 28 66 L 32 52 L 20 44 L 32 36 L 28 22 L 42 26 Z" 
        fill="none" stroke="rgba(214, 168, 79, 0.45)" stroke-width="1.5"/>

  <!-- Open Book -->
  <path d="M 50 56 C 42 50, 30 48, 22 52 L 22 75 C 30 71, 42 73, 50 79 C 58 73, 70 71, 78 75 L 78 52 C 70 48, 58 50, 50 56 Z" 
        fill="#FFFFFF" stroke="#D6A84F" stroke-width="2.5"/>
  <path d="M 50 56 L 50 79" stroke="#D6A84F" stroke-width="2.5"/>

  <!-- Pen tip -->
  <path d="M 50 23 L 55 32 L 50 36 L 45 32 Z" fill="url(#goldGradMark)"/>
  <circle cx="50" cy="40" r="3.5" fill="url(#goldGradMark)"/>
</svg>

