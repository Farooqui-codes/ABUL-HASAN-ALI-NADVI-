<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Embed Official User Logo Emblem -->
  <g transform="translate(10, 5)">
    <image href="official-logo.png" x="0" y="0" width="110" height="110"/>
  </g>

  <!-- School Titles -->
  <g transform="translate(130, 20)">
    <!-- Urdu Name -->
    <text x="0" y="32" font-family="'Noto Naskh Arabic', 'Amiri', serif" font-size="28" font-weight="700" fill="#064E3B">
      جامعہ ابوالحسن علی ندوی
    </text>
    <text x="315" y="30" font-family="'Noto Naskh Arabic', serif" font-size="13" font-weight="600" fill="#D97706">
      (ربانی فاؤنڈیشن مارول)
    </text>

    <!-- English Official Name -->
    <text x="0" y="62" font-family="'Poppins', 'Inter', sans-serif" font-size="20" font-weight="800" fill="#064E3B" letter-spacing="1">
      JAMIA ABUL HASAN ALI NADWI
    </text>

    <!-- Tagline: Nursery to 4th Standard & Rabbani Foundation Marul -->
    <text x="0" y="80" font-family="'Poppins', 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#047857" letter-spacing="1.2">
      RABBANI FOUNDATION MARUL • NURSERY TO 4TH STANDARD
    </text>
    <line x1="0" y1="88" x2="385" y2="88" stroke="#D6A84F" stroke-width="1.8" stroke-opacity="0.8"/>
  </g>
</svg>
